<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderní Hrací Kostka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #1a103c, #0b0d19, #05050a);
            min-height: 100vh;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Glassmorphism styling */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-button {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5),
                        0 8px 10px -6px rgba(168, 85, 247, 0.5);
            transition: all 0.2s ease;
        }

        .glass-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.7),
                        0 10px 12px -5px rgba(168, 85, 247, 0.7);
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
        }

        .glass-button:active {
            transform: translateY(1px);
        }

        /* 3D Dice styling */
        .dice-container {
            perspective: 1000px;
        }

        .dice-box {
            position: relative;
            width: 130px;
            height: 130px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.03));
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2),
                        inset 0 0 15px rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        /* Animation Keyframes */
        @keyframes rolling3D {
            0% {
                transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(0.9);
            }
            25% {
                transform: rotateX(180deg) rotateY(90deg) rotateZ(45deg) scale(1.1);
            }
            50% {
                transform: rotateX(360deg) rotateY(270deg) rotateZ(180deg) scale(0.95);
            }
            75% {
                transform: rotateX(540deg) rotateY(360deg) rotateZ(270deg) scale(1.05);
            }
            100% {
                transform: rotateX(720deg) rotateY(540deg) rotateZ(360deg) scale(1);
            }
        }

        .is-rolling {
            animation: rolling3D 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes shakeCard {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px) translateY(2px); }
            40% { transform: translateX(4px) translateY(-2px); }
            60% { transform: translateX(-3px) translateY(-1px); }
            80% { transform: translateX(3px) translateY(1px); }
        }

        .shake {
            animation: shakeCard 0.4s ease-in-out;
        }

        /* Dot Grid Layouts for Dice Face */
        .dice-dots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            padding: 18px;
            gap: 4px;
        }

        .dot {
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-radius: 50%;
            justify-self: center;
            align-self: center;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8),
                        0 0 20px rgba(168, 85, 247, 0.6);
            visibility: hidden;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dot.visible {
            visibility: visible;
            transform: scale(1);
        }

        /* Custom Scrollbar for History */
        .history-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .history-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .history-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .history-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Main Container Card -->
    <div id="mainCard" class="glass-card w-full max-w-md rounded-3xl p-6 sm:p-8 text-center relative overflow-hidden">
        
        <!-- Ambient background glows inside card -->
        <div class="absolute -top-20 -left-20 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300">
                Hrací Kostka
            </h1>
            <!-- Settings / View Mode Toggle Button -->
            <button onclick="toggleDisplayMode()" title="Přepnout vzhled (Tečky / Číslo)" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 transition-colors">
                <span id="modeIcon" class="text-xs font-semibold px-1 text-indigo-300">🔢 Čísla</span>
            </button>
        </div>

        <!-- Interactive Dice Display Area -->
        <div class="dice-container my-8 flex justify-center items-center">
            <div id="dice" class="dice-box flex items-center justify-center cursor-pointer select-none" onclick="hodKostkou()">
                
                <!-- Dot Pattern Container -->
                <div id="dotsView" class="dice-dots">
                    <div class="dot" id="dot1"></div>
                    <div class="dot" id="dot2"></div>
                    <div class="dot" id="dot3"></div>
                    <div class="dot" id="dot4"></div>
                    <div class="dot" id="dot5"></div>
                    <div class="dot" id="dot6"></div>
                    <div class="dot" id="dot7"></div>
                    <div class="dot" id="dot8"></div>
                    <div class="dot" id="dot9"></div>
                </div>

                <!-- Big Number View (Alternative Mode) -->
                <div id="numberView" class="hidden text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-purple-200 drop-shadow-[0_0_12px_rgba(168,85,247,0.5)]">
                    ?
                </div>

            </div>
        </div>

        <!-- Primary Roll Button -->
        <button id="rollBtn" onclick="hodKostkou()" class="glass-button w-full py-4 px-6 rounded-2xl text-lg font-bold tracking-wide text-white transition-all transform active:scale-95 flex items-center justify-center space-x-2">
            <span>Hodit kostkou</span>
            <svg class="w-5 h-5 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
        </button>

        <!-- Stats Section -->
        <div class="grid grid-cols-2 gap-3 mt-6">
            <div class="bg-white/5 border border-white/5 rounded-2xl p-3 text-center">
                <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Počet hodů</p>
                <p id="totalRolls" class="text-xl font-bold text-indigo-300 mt-1">0</p>
            </div>
            <div class="bg-white/5 border border-white/5 rounded-2xl p-3 text-center">
                <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Průměr</p>
                <p id="averageRoll" class="text-xl font-bold text-purple-300 mt-1">0.0</p>
            </div>
        </div>

        <!-- History Strip -->
        <div class="mt-6 text-left">
            <div class="flex justify-between items-center mb-2 px-1">
                <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Historie hodů</p>
                <button onclick="resetStats()" class="text-xs text-gray-500 hover:text-red-400 transition-colors">Vymazat</button>
            </div>
            <div id="historyList" class="history-scroll flex space-x-2 overflow-x-auto py-2 px-1 min-h-[48px] items-center">
                <span class="text-xs text-gray-500 italic px-1">Zatím neproběhl žádný hod...</span>
            </div>
        </div>

    </div>

    <script>
        // App State
        let isRolling = false;
        let displayMode = 'dots'; // 'dots' or 'number'
        let history = [];

        // Synthesize Dice Rolling Audio using Web Audio API (No external sound files needed)
        function playRollSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                // Generate a few random clicks to mimic dice tumbling on surface
                const clicksCount = 5;
                for (let i = 0; i < clicksCount; i++) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'triangle';
                    // Random pitch variation
                    osc.frequency.setValueAtTime(150 + Math.random() * 200, ctx.currentTime + (i * 0.08));

                    gain.gain.setValueAtTime(0.15, ctx.currentTime + (i * 0.08));
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (i * 0.08) + 0.05);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(ctx.currentTime + (i * 0.08));
                    osc.stop(ctx.currentTime + (i * 0.08) + 0.06);
                }
            } catch (e) {
                // Ignore audio errors if context is blocked by browser policies
            }
        }

        // Dot positions mapping for a 3x3 grid
        // Grid indices:
        // 1 2 3
        // 4 5 6
        // 7 8 9
        const dotMappings = {
            1: [5], // Center
            2: [1, 9], // Top-left, Bottom-right
            3: [1, 5, 9], // Diagonal
            4: [1, 3, 7, 9], // Corners
            5: [1, 3, 5, 7, 9], // Corners + Center
            6: [1, 3, 4, 6, 7, 9] // Two vertical lines
        };

        function renderDots(value) {
            // Clear all dots
            for (let i = 1; i <= 9; i++) {
                document.getElementById(`dot${i}`).classList.remove('visible');
            }

            // Show relevant dots
            const activeDots = dotMappings[value] || [];
            activeDots.forEach(index => {
                const dot = document.getElementById(`dot${index}`);
                if (dot) dot.classList.add('visible');
            });
        }

        function setDiceValue(value) {
            if (displayMode === 'dots') {
                renderDots(value);
            } else {
                document.getElementById('numberView').textContent = value;
            }
        }

        function toggleDisplayMode() {
            displayMode = displayMode === 'dots' ? 'number' : 'dots';
            const dotsView = document.getElementById('dotsView');
            const numberView = document.getElementById('numberView');
            const modeIcon = document.getElementById('modeIcon');

            if (displayMode === 'dots') {
                dotsView.classList.remove('hidden');
                numberView.classList.add('hidden');
                modeIcon.textContent = '🔢 Čísla';
            } else {
                dotsView.classList.add('hidden');
                numberView.classList.remove('hidden');
                modeIcon.textContent = '🎲 Tečky';
            }

            // Re-render current last roll or default value
            const currentVal = history.length > 0 ? history[0] : 1;
            setDiceValue(currentVal);
        }

        function triggerHaptic() {
            if ('vibrate' in navigator) {
                navigator.vibrate([20, 30, 20]);
            }
        }

        function hodKostkou() {
            if (isRolling) return;
            isRolling = true;

            const dice = document.getElementById('dice');
            const mainCard = document.getElementById('mainCard');
            const rollBtn = document.getElementById('rollBtn');

            // Play audio and trigger haptics
            playRollSound();
            triggerHaptic();

            // Disable button feedback
            rollBtn.classList.add('opacity-80');

            // Apply 3D rotation animation to dice
            dice.classList.add('is-rolling');
            mainCard.classList.add('shake');

            // Rapidly cycle values during animation
            let counter = 0;
            const interval = setInterval(() => {
                const tempVal = Math.floor(Math.random() * 6) + 1;
                setDiceValue(tempVal);
                counter++;
                if (counter > 8) clearInterval(interval);
            }, 60);

            // Final result calculation
            setTimeout(() => {
                const finalResult = Math.floor(Math.random() * 6) + 1;
                setDiceValue(finalResult);

                // Update application state
                history.unshift(finalResult);
                updateStats();

                // Cleanup animation classes
                dice.classList.remove('is-rolling');
                mainCard.classList.remove('shake');
                rollBtn.classList.remove('opacity-80');

                isRolling = false;
            }, 700);
        }

        function updateStats() {
            const totalRollsEl = document.getElementById('totalRolls');
            const averageRollEl = document.getElementById('averageRoll');
            const historyListEl = document.getElementById('historyList');

            totalRollsEl.textContent = history.length;

            const sum = history.reduce((acc, curr) => acc + curr, 0);
            const avg = history.length > 0 ? (sum / history.length).toFixed(1) : '0.0';
            averageRollEl.textContent = avg;

            // Update History Pills
            historyListEl.innerHTML = history.map((val, idx) => `
                <div class="flex-shrink-0 w-9 h-9 flex items-center justify-center rounded-xl ${idx === 0 ? 'bg-gradient-to-br from-indigo-500 to-purple-500 text-white font-bold shadow-lg scale-105' : 'bg-white/10 text-gray-300'} text-sm transition-all">
                    ${val}
                </div>
            `).join('');
        }

        function resetStats() {
            history = [];
            updateStats();
            document.getElementById('historyList').innerHTML = '<span class="text-xs text-gray-500 italic px-1">Zatím neproběhl žádný hod...</span>';
            setDiceValue(1);
        }

        // Initialize default view
        window.onload = function() {
            setDiceValue(1);
        };
    </script>
</body>
</html>
